Use"><stop offset="0" stop-color="#ffe89a"/><stop offset=".55" stop-color="#ffd166"/><stop offset="1" stop-color="#ffac36"/></linearGradient></defs><g clip-path="url(#coplan-amber-silhouette)"><path fill="url(#coplan-amber-base)" d="M0 0H256V256H0Z"/><path fill="url(#coplan-amber-gold)" d="M0 0H256V256H0Z"/><path fill="url(#coplan-amber-coral)" d="M0 0H256V256H0Z"/><path fill="url(#coplan-amber-amber)" d="M0 0H256V256H0Z"/></g><path fill="url(#coplan-amber-fold)" d="M190 14Q184 9 184 17V54Q184 60 190 60H235Q242 60 237 55Z"/><g fill="#fff"><rect width="148" height="30" x="56" y="94" rx="15"/><rect width="108" height="30" x="56" y="142" rx="15"/></g></svg>